name: Release

on:
  # Closed/merged only: permits releases for reviewed PRs originating from forks.
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

# Queue merges rather than replacing pending releases.
concurrency:
  group: npm-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          cache: false
      # Trusted Publishing requires npm >=11.5.1; keep the supported npm 11 line.
      - run: npm install --global npm@11
      - run: node .github/scripts/release-checks.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: node .github/scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
